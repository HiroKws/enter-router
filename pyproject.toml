[project]
name = "enter-router"
version = "0.1.0"
description = "Win11 resident tool: Enter policy routing (hook -> policy -> sinks). No build step; run from source."
authors = [{ name = "Hirohisa Kawase", email = "hirokws@gmail.com" }]
requires-python = ">=3.14"
# No runtime dependencies: every Win32 call goes through ctypes (platform/win32lib.py).
dependencies = []
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
